<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocVerify AI</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .app {
            padding: 40px 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .subtitle {
            margin-top: 10px;
            color: #cbd5e1;
        }

        .welcome {
            margin-top: 80px;
        }

        #startButton {
            margin-top: 30px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #082f49;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #verificationScreen {
            display: none;
            margin-top: 50px;
        }

        .upload-box {
            margin-top: 25px;
            padding: 30px;
            border: 2px dashed #475569;
            border-radius: 15px;
            background: #1e293b;
        }

        #fileInput {
            display: none;
        }

        .select-button {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 25px;
            background: #38bdf8;
            color: #082f49;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }
        #previewBox {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #1e293b;
            border-radius: 15px;
        }

        #preview {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 10px;
        }

        #fileName {
            margin-top: 10px;
            color: #cbd5e1;
            word-break: break-word;
        }

        .footer {
            margin-top: 50px;
            padding: 20px;
            color: #94a3b8;
            font-size: 14px;
        }

        .footer strong {
            color: white;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="logo">
            Doc<span>Verify</span> AI
        </div>

        <div class="subtitle">
            Intelligent Document Verification
        </div>

        <div class="welcome" id="welcomeScreen">

            <h1>Verify Your Document</h1>

            <p>
                Detect possible fake or altered documents
                using DocVerify AI.
            </p>

            <button id="startButton">
                Start Verification
            </button>

        </div>
        <div id="verificationScreen">

            <h1>Select a Document</h1>

            <div class="upload-box">

                <p>
                    Select a photo or document
                    to begin verification.
                </p>

                <label for="fileInput" class="select-button">
                    Select Document
                </label>

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,.pdf"
                >

            </div>

            <div id="previewBox">

                <img
                    id="preview"
                    alt="Document preview"
                >

                <p id="fileName"></p>

            </div>

        </div>

        <div class="footer">
            Criado por <strong>Anstee Fula Lisboa</strong>
        </div>

    </div>
<script>

    const startButton =
        document.getElementById("startButton");

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    const verificationScreen =
        document.getElementById("verificationScreen");

    const fileInput =
        document.getElementById("fileInput");

    const preview =
        document.getElementById("preview");

    const previewBox =
        document.getElementById("previewBox");

    const fileName =
        document.getElementById("fileName");


    startButton.addEventListener("click", function () {

        welcomeScreen.style.display = "none";

        verificationScreen.style.display = "block";

    });


    fileInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        fileName.textContent = file.name;


        if (file.type.startsWith("image/")) {

            const imageURL =
                URL.createObjectURL(file);

            preview.src = imageURL;

            previewBox.style.display = "block";

        }

    });

</script>

</body>
</html>
