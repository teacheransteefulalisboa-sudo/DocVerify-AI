<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DocVerify AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #14213d;
}

/* TELA INICIAL */

#welcomeScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #0b1f3a;
    color: white;
    padding: 25px;
}

.welcomeContent {
    max-width: 650px;
}

.shield {
    font-size: 80px;
}

.welcomeTitle {
    font-size: 42px;
    margin: 15px 0 5px;
}

.welcomeText {
    font-size: 18px;
    opacity: .85;
    line-height: 1.6;
}

.startButton {
    margin-top: 25px;
    padding: 16px 40px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #0b1f3a;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* APLICAÇÃO */

#app {
    display: none;
}

header {
    background: #0b1f3a;
    color: white;
    padding: 22px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.subtitle {
    margin-top: 5px;
    font-size: 14px;
    opacity: .8;
}

.container {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
}

.description {
    text-align: center;
    color: #64748b;
}

.upload-area {
    margin-top: 30px;
    border: 2px dashed #8ca0bb;
    border-radius: 15px;
    padding: 45px 20px;
    text-align: center;
}

.icon {
    font-size: 55px;
}

.selectButton {
    background: #1769aa;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

input[type="file"] {
    display: none;
}

#fileName {
    margin-top: 15px;
    color: #52647d;
    word-break: break-word;
}

/* PREVISUALIZAÇÃO */

#previewBox {
    display: none;
    margin-top: 30px;
    text-align: center;
}

#preview {
    display: block;
    max-width: 100%;
    max-height: 500px;
    margin: 15px auto;
    border-radius: 12px;
    border: 1px solid #d7dee8;
}

.pdfBox {
    display: none;
    padding: 25px;
    background: #f6f8fb;
    border-radius: 12px;
}

.actionButton {
    border: none;
    padding: 13px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

.removeButton {
    background: #b42318;
    color: white;
}

.analyzeButton {
    background: #16803c;
    color: white;
}

/* RESULTADO */

#result {
    display: none;
    margin-top: 30px;
}

.resultCard {
    background: #f6f8fb;
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
}

.status {
    padding: 12px;
    border-radius: 8px;
    background: #fff3cd;
    color: #805f00;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 180px;
    padding: 15px;
    border: 1px solid #ccd5e0;
    border-radius: 10px;
    resize: vertical;
}

.warning {
    background: #fff3cd;
    color: #805f00;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #718096;
    font-size: 13px;
}

@media(max-width:600px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .card {
        padding: 20px;
    }

    .welcomeTitle {
        font-size: 30px;
    }

}

</style>

</head>
