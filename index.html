<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocVerify AI</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .app {
            padding: 40px 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .subtitle {
            margin-top: 10px;
            color: #cbd5e1;
        }

        .welcome {
            margin-top: 80px;
        }

        #startButton {
            margin-top: 30px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #082f49;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #verificationScreen {
            display: none;
            margin-top: 50px;
        }

        .upload-box {
            margin-top: 25px;
            padding: 30px;
            border: 2px dashed #475569;
            border-radius: 15px;
            background: #1e293b;
        }

        #fileInput {
            display: none;
        }

        .select-button {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 25px;
            background: #38bdf8;
            color: #082f49;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }
