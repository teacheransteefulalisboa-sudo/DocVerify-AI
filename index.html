<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DocVerify AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #14213d;
}

header {
    background: #0b1f3a;
    color: white;
    padding: 22px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.subtitle {
    margin-top: 5px;
    font-size: 14px;
    opacity: 0.8;
}

.container {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
}

.description {
    text-align: center;
    color: #64748b;
}

.upload-area {
    margin-top: 30px;
    border: 2px dashed #8ca0bb;
    border-radius: 15px;
    padding: 40px 20px;
    text-align: center;
}

.icon {
    font-size: 55px;
}

button {
    background: #1769aa;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.secondary {
    background: #64748b;
}

.analyze {
    background: #16803c;
}

input {
    display: none;
}

#fileName {
    margin-top: 15px;
    color: #52647d;
    word-break: break-word;
}

#previewBox {
    display: none;
    margin-top: 30px;
    text-align: center;
}

#preview {
    max-width: 100%;
    max-height: 500px;
    border-radius: 12px;
    border: 1px solid #d7dee8;
}

#pdfBox {
    display: none;
    padding: 25px;
    background: #f6f8fb;
    border-radius: 12px;
}

#progressBox {
    display: none;
    margin-top: 25px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #1769aa;
    transition: width .2s;
}

#result {
    display: none;
    margin-top: 30px;
}

.result-card {
    background: #f6f8fb;
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
}

.result-title {
    font-weight: bold;
    font-size: 18px;
}

.risk-low {
    color: #16803c;
    font-weight: bold;
}

.risk-medium {
    color: #a15c00;
    font-weight: bold;
}

.risk-high {
    color: #b42318;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 220px;
    padding: 15px;
    border: 1px solid #ccd5e0;
    border-radius: 10px;
    resize: vertical;
    font-family: Arial, sans-serif;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #dce2e9;
}

td:first-child {
    font-weight: bold;
    width: 40%;
}

.warning {
    background: #fff3cd;
    color: #805f00;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #718096;
    font-size: 13px;
}

@media(max-width:600px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .card {
        padding: 20px;
    }

    .logo {
        font-size: 24px;
    }

    td:first-child {
        width: 45%;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
DocVerify AI
</div>

<div class="subtitle">
Intelligent Document Verification System
</div>

</header>


<div class="container">

<div class="card">

<h1>
🔎 Verificar documento
</h1>

<p class="description">
Certificados, BI, passaportes, cartas de condução e outros documentos.
</p>


<div class="upload-area">

<div class="icon">
📄
</div>

<h2>
Carregar documento
</h2>

<p>
Selecione uma fotografia JPG, PNG, WEBP ou um PDF.
</p>

<button onclick="document.getElementById('document').click()">
📷 Selecionar documento
</button>

<input
type="file"
id="document"
accept="image/*,.pdf"
>
