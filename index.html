<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analisador de Documentos</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.header {
    background: #17365d;
    color: white;
    padding: 22px 15px;
    text-align: center;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 8px 0 0;
    font-size: 14px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 18px;
}

.file-label {
    display: block;
    width: 100%;
    padding: 16px;
    text-align: center;
    background: #17365d;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

#fileInput {
    display: none;
}

.preview-box {
    margin-top: 18px;
    text-align: center;
    display: none;
}

#preview {
    max-width: 100%;
    max-height: 450px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.analyze {
    background: #198754;
    color: white;
}

.copy {
    background: #0d6efd;
    color: white;
}

.new {
    background: #6c757d;
    color: white;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

#status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.progress-container {
    display: none;
    margin-top: 15px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #198754;
    transition: width 0.2s;
}

.result-box {
    display: none;
}

#result {
    width: 100%;
    min-height: 250px;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-size: 16px;
    line-height: 1.5;
    font-family: Arial, sans-serif;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📄 Analisador de Documentos</h1>
        <p>Selecione uma imagem para extrair o texto</p>
    </div>

    <div class="card">

        <label for="fileInput" class="file-label">
            📁 ESCOLHER DOCUMENTO
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

        <div class="preview-box" id="previewBox">
            <h3>Documento selecionado</h3>

            <img id="preview" alt="Documento selecionado">

            <button
                class="analyze"
                id="analyzeBtn"
                disabled
            >
                🔍 ANALISAR DOCUMENTO
            </button>
        </div>

        <div class="progress-container" id="progressContainer">

            <p id="progressText">
                A preparar análise...
            </p>

            <div class="progress">
                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>
            </div>

        </div>

        <div id="status"></div>

    </div>

    <div class="card result-box" id="resultBox">

        <h3>📝 Texto encontrado</h3>

        <textarea
            id="result"
            placeholder="O texto extraído aparecerá aqui..."
        ></textarea>

        <button
            class="copy"
            id="copyBtn"
        >
            📋 COPIAR TEXTO
        </button>
