<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocVerify AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-top: 50px;
        }

        .logo span {
            color: #38bdf8;
        }

        .subtitle {
            margin-top: 12px;
            color: #cbd5e1;
            font-size: 15px;
        }

        .welcome {
            margin-top: 80px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .welcome p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        button {
            border: none;
            cursor: pointer;
        }

        #startButton {
            margin-top: 35px;
            padding: 16px 35px;
            border-radius: 10px;
            background: #38bdf8;
            color: #082f49;
            font-size: 17px;
            font-weight: bold;
        }

        #startButton:hover {
            background: #7dd3fc;
        }

        #verificationScreen {
            display: none;
        }

        .upload-box {
            margin-top: 35px;
            border: 2px dashed #475569;
            border-radius: 15px;
            padding: 35px 20px;
            background: #1e293b;
        }

        .upload-box p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        #fileInput {
            display: none;
        }

        .select-button {
            display: inline-block;
            padding: 14px 25px;
            background: #38bdf8;
            color: #082f49;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        #previewBox {
            display: none;
            margin-top: 25px;
            background: #1e293b;
            padding: 15px;
            border-radius: 15px;
        }

        #preview {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 10px;
        }

        #fileName {
            margin-top: 12px;
            color: #cbd5e1;
            word-break: break-word;
        }

        .footer {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 40px;
        }

        .footer strong {
            color: white;
        }
    </style>
</head>

<body>

    <div class="app">

        <div>

            <div class="logo">
                Doc<span>Verify</span> AI
            </div>

            <div class="subtitle">
                Intelligent Document Verification
            </div>


            <!-- TELA INICIAL -->

            <div class="welcome" id="welcomeScreen">

                <h1>Verify Your Document</h1>

                <p>
                    Detect possible fake or altered documents
                    using DocVerify AI.
                </p>

                <button id="startButton">
                    Start Verification
                </button>

            </div>


            <!-- TELA DE VERIFICAÇÃO -->

            <div id="verificationScreen">

                <h1 style="margin-top: 50px;">

                </h1>
